<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Responda — O salário sumiu</title>
<meta name="robots" content="noindex">
<style>
:root{--ink:#142034;--ink-soft:#4A5263;--bg:#F8F6F1;--surface:#FFFFFF;--accent:#CDA254;--ok:#2F5D47;--line:#E2DDD2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",system-ui,Arial,sans-serif;min-height:100%}
body{display:flex;flex-direction:column;min-height:100vh;padding:20px;padding-bottom:max(20px,env(safe-area-inset-bottom))}
.wrap{max-width:480px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-size:23px;line-height:1.3;margin:4px 0 0}
.state{font-size:15px;color:var(--ink-soft);line-height:1.5}
.options{display:flex;flex-direction:column;gap:10px;margin-top:6px}
button.opt{all:unset;box-sizing:border-box;display:block;width:100%;min-height:52px;padding:14px 16px;background:var(--surface);border:2px solid var(--line);border-radius:12px;font-size:16px;font-weight:600;color:var(--ink);text-align:left;cursor:pointer}
button.opt:active{background:var(--accent);border-color:var(--accent);color:#1a1200}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px}
.item p.label{font-size:16px;font-weight:700;margin:0 0 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
button.chip{all:unset;box-sizing:border-box;min-height:40px;padding:8px 14px;border:2px solid var(--line);border-radius:999px;font-size:14px;font-weight:600;color:var(--ink);background:var(--surface);cursor:pointer}
button.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
button.submit{all:unset;box-sizing:border-box;display:block;width:100%;min-height:54px;margin-top:8px;background:var(--ink);color:#fff;border-radius:12px;font-size:16px;font-weight:700;text-align:center;cursor:pointer;opacity:.4}
button.submit.ready{opacity:1}
.thanks{font-size:20px;font-weight:700;color:var(--ok)}
.thanks + p{color:var(--ink-soft);font-size:15px}
footer{text-align:center;font-size:12px;color:var(--ink-soft);padding-top:18px}
</style>
</head>
<body>
<div class="wrap" id="app">
  <p class="eyebrow">O salário sumiu. E agora?</p>
  <p class="state" id="state">Conectando…</p>
</div>
<footer>Resposta anônima · sem dados pessoais</footer>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  projectId: "airo-financas-pessoais",
  appId: "1:365735742321:web:9fdeafd5a7d028a988c4d0",
  storageBucket: "airo-financas-pessoais.firebasestorage.app",
  apiKey: "AIzaSyD6Pqzq7Y24TQ-MiIUnLirGs9xlsLOaVaw",
  authDomain: "airo-financas-pessoais.firebaseapp.com",
  messagingSenderId: "365735742321"
};

const app = document.getElementById("app");
const stateEl = document.getElementById("state");

function setState(html) { stateEl.outerHTML = `<p class="state" id="state">${html}</p>`; }
function renderError(msg) {
  app.innerHTML = `<p class="eyebrow">O salário sumiu. E agora?</p><p class="state">${msg}</p>`;
}

const params = new URLSearchParams(location.search);
const sessionId = params.get("s");
const activityId = params.get("a");

if (!sessionId || !activityId) {
  renderError("Link incompleto. Peça ao apresentador para mostrar o QR code novamente.");
} else {
  let firebaseApp, auth, db;
  try {
    firebaseApp = initializeApp(firebaseConfig);
    auth = getAuth(firebaseApp);
    db = getFirestore(firebaseApp);
  } catch (e) {
    renderError("Não foi possível conectar agora. Tente novamente em alguns segundos.");
  }

  if (db) {
    let uid = null;

    onAuthStateChanged(auth, user => {
      if (user) { uid = user.uid; watchActivity(); }
    });
    signInAnonymously(auth).catch(() => {
      renderError("Não foi possível conectar agora. Verifique sua internet e recarregue a página.");
    });

    let unsub = null;
    function watchActivity() {
      const activityRef = doc(db, "sessions", sessionId, "activities", activityId);
      if (unsub) return;
      unsub = onSnapshot(activityRef, snap => {
        if (!snap.exists()) {
          setState("Aguardando o apresentador abrir esta atividade…");
          return;
        }
        unsub(); unsub = null;
        renderActivity(activityRef, snap.data());
      }, () => renderError("Não foi possível carregar a atividade."));
    }

    async function alreadyAnswered(activityRef) {
      try {
        const snap = await getDoc(doc(activityRef, "responses", uid));
        return snap.exists();
      } catch (e) { return false; }
    }

    async function renderActivity(activityRef, data) {
      if (await alreadyAnswered(activityRef)) {
        showThanks(data.question, true);
        return;
      }
      if (data.type === "classify") {
        renderClassify(activityRef, data);
      } else {
        renderChoice(activityRef, data);
      }
    }

    function showThanks(question, already) {
      app.innerHTML = `
        <p class="eyebrow">O salário sumiu. E agora?</p>
        <h1>${question || ""}</h1>
        <p class="thanks">${already ? "Você já respondeu" : "Resposta registrada!"}</p>
        <p>Obrigado por participar. Volte sua atenção para a tela grande — o resultado aparece ao vivo.</p>`;
    }

    async function submitResponse(activityRef, value, onError) {
      try {
        await setDoc(doc(activityRef, "responses", uid), { value, ts: serverTimestamp() });
        showThanks(undefined, false);
      } catch (e) {
        onError && onError();
      }
    }

    function renderChoice(activityRef, data) {
      const options = Array.isArray(data.options) ? data.options : [];
      app.innerHTML = `
        <p class="eyebrow">O salário sumiu. E agora?</p>
        <h1>${data.question}</h1>
        <div class="options">${options.map((label, i) =>
          `<button class="opt" data-i="${i}">${label}</button>`).join("")}</div>`;
      app.querySelectorAll("button.opt").forEach(btn => {
        btn.addEventListener("click", () => {
          app.querySelectorAll("button.opt").forEach(b => b.disabled = true);
          submitResponse(activityRef, options[Number(btn.dataset.i)], () => {
            showThanks(data.question, true);
          });
        });
      });
    }

    function renderClassify(activityRef, data) {
      const items = (data.options && data.options.items) || [];
      const categories = (data.options && data.options.categories) || [];
      const selected = {};
      app.innerHTML = `
        <p class="eyebrow">O salário sumiu. E agora?</p>
        <h1>${data.question}</h1>
        <div id="items">${items.map(it => `
          <div class="item" data-id="${it.id}">
            <p class="label">${it.label}</p>
            <div class="chips">${categories.map(cat =>
              `<button class="chip" data-cat="${cat}">${cat}</button>`).join("")}</div>
          </div>`).join("")}</div>
        <button class="submit" id="submitBtn">Enviar classificação</button>`;

      function updateSubmitState() {
        const ready = items.every(it => selected[it.id]);
        document.getElementById("submitBtn").classList.toggle("ready", ready);
      }

      app.querySelectorAll(".item").forEach(itemEl => {
        const id = itemEl.dataset.id;
        itemEl.querySelectorAll("button.chip").forEach(chip => {
          chip.addEventListener("click", () => {
            selected[id] = chip.dataset.cat;
            itemEl.querySelectorAll("button.chip").forEach(c => c.classList.toggle("on", c === chip));
            updateSubmitState();
          });
        });
      });

      document.getElementById("submitBtn").addEventListener("click", () => {
        if (!items.every(it => selected[it.id])) return;
        document.getElementById("submitBtn").disabled = true;
        submitResponse(activityRef, selected, () => showThanks(data.question, true));
      });
    }
  }
}
</script>
</body>
</html>
